<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcecee">
<title>Mes livraisons · Timfa online shop</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../images/logo-carre.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: carte centrée, formulaire puis frise de suivi en 4 étapes. Couleurs du site. */
:root{--bg:#fffafa;--blush:#fcecee;--blush-2:#f7d9dd;--rose:#c4526e;--ink:#2a1c1e;--muted:#7e6a6e;--line:#f1dfe2;--ok:#1f8a4c;--display:"Playfair Display",Georgia,serif;--body:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{min-height:100vh;background:linear-gradient(150deg,var(--blush) 0%,var(--bg) 50%,var(--blush-2) 100%);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 50px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:58px}
.top a{color:var(--ink);font-size:14px;font-weight:500}
.card{background:#fff;border-radius:28px;padding:26px 22px;margin-top:18px;box-shadow:0 40px 70px -46px rgba(120,30,60,.45);animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
h1{font-family:var(--display);font-weight:500;font-size:32px;margin:0 0 6px}
h1 span{color:var(--rose)}
p.lead{color:var(--muted);margin:0 0 18px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
input{font:inherit;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(196,82,110,.15)}
button{font:inherit;width:100%;margin-top:16px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:14px;font-weight:500;cursor:pointer}
.err{color:#d6334a;font-size:14px;margin-top:10px;min-height:20px}
.res{margin-top:22px;border-top:1px solid var(--line);padding-top:20px;animation:rise .5s both}
.res h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0}
.meta{color:var(--muted);font-size:13.5px}
.steps{list-style:none;margin:20px 0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;position:relative;padding-bottom:18px}
.steps li::before{content:"";position:absolute;left:16px;top:30px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.dot{width:34px;height:34px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:16px;position:relative;z-index:1}
.steps li.done .dot{background:var(--rose);color:#fff}
.steps li.done::before{background:var(--rose)}
.steps li.now .dot{box-shadow:0 0 0 6px rgba(196,82,110,.18);animation:pulse 1.8s infinite}
.steps b{display:block;font-weight:600}
.steps small{color:var(--muted)}
.items{background:var(--bg);border-radius:16px;padding:12px 14px;white-space:pre-line;font-size:14px}
.total{display:flex;justify-content:space-between;margin-top:10px;font-weight:600}
.total b{font-family:var(--display);font-size:22px;color:var(--rose);font-weight:500}
.cancel{background:#f3eeee;color:var(--muted);border-radius:14px;padding:12px;text-align:center}
.wa{display:block;text-align:center;margin-top:16px;color:var(--rose);font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(196,82,110,.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.o{border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;animation:rise .5s both;display:grid;gap:8px}
.o.ok{opacity:.55}
.o h2{font-size:17px;margin:0;display:flex;justify-content:space-between;gap:8px;font-weight:600}
.o h2 small{color:var(--muted);font-weight:400;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row a,.row button{flex:1;min-width:110px;margin:0;text-align:center;text-decoration:none;border-radius:999px;padding:11px;font-weight:500;font-size:14px}
.call{background:var(--blush);color:var(--ink)}
.map{background:#eef3ff;color:#2b4a9b}
.live{background:var(--ok);color:#fff}
.cash{font-family:var(--display);font-size:24px;color:var(--rose)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:#fff3d6;color:#8a5a00}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.sum{display:flex;justify-content:space-between;background:var(--bg);border-radius:16px;padding:12px 14px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="../images/logo-sombre.png" alt="Timfa online shop"><button type="button" id="re" style="width:auto;margin:0;padding:8px 16px;font-size:13px">↻ Actualiser</button></div>
  <div class="card">
    <h1>Mes <span>livraisons</span></h1>
    <p class="lead" id="lead">Chargement…</p>
    <div id="sum"></div>
    <div id="list"></div>
  </div>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbyZiPC2weLVrD2r8GExmtv_6MxTw0TNZxvXRm4wRLXdy5qTdi2SPsDUQJVgV_s45h7N/exec";
const $ = s => document.querySelector(s);
const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ") + " F";
const K = new URLSearchParams(location.search).get("k") || "";
const today = new Date().toISOString().slice(0,10);
let D = null;
const tel = p => { let d = String(p||"").replace(/\D/g,""); if (d.length === 10) d = "225" + d; return d; };
function load(){
  if (!K) { $("#lead").textContent = "Lien incomplet. Demandez votre lien à Timfa."; return; }
  fetch(API + "?action=courier&k=" + encodeURIComponent(K)).then(r=>r.json()).then(d => { if (!d.ok) { $("#lead").textContent = "Ce lien n’est pas valable. Demandez votre lien à Timfa."; return; } D = d; render(); })
    .catch(() => { $("#lead").textContent = "Connexion impossible. Réessayez avec ↻."; });
}
function render(){
  const L = D.orders.slice().sort((a,b) => (a.status==="Livrée") - (b.status==="Livrée") || String(a.delivery||"9").localeCompare(String(b.delivery||"9")));
  const todo = L.filter(o => o.status !== "Livrée"), cash = todo.filter(o => !o.paid).reduce((a,o)=>a+o.total,0), done = L.filter(o=>o.status==="Livrée");
  $("#lead").textContent = `Bonjour ${D.courier} 👋 ${todo.length ? todo.length + " livraison(s) à faire." : "Aucune livraison en attente."}`;
  $("#sum").innerHTML = todo.length || done.length ? `<div class="sum"><span>À encaisser</span><b>${fmt(cash)}</b></div>${done.length ? `<div class="sum"><span>Livrées aujourd’hui</span><b>${done.length}</b></div>` : ""}` : "";
  $("#list").innerHTML = L.length ? L.map(o => { const dest = o.dest || "", who = dest ? dest : o.name + " · " + o.phone, ph = (dest.match(/(\+?\d[\d ]{7,})/) || [])[1] || o.phone, place = dest ? dest : o.place;
    return `<article class="o ${o.status==="Livrée"?"ok":""}">
      <h2>${esc(o.id)} <small>${o.delivery ? (o.delivery===today ? "Aujourd’hui" : new Date(o.delivery+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})) : "Date à confirmer"}</small></h2>
      <div><b>${esc(dest ? "Destinataire : " + dest : o.name)}</b><br>${dest ? "" : "📞 " + esc(o.phone) + "<br>"}📍 ${esc(o.place)}</div>
      ${o.surprise ? `<span class="tag">🎁 Cadeau surprise : ne rien dire du contenu</span>` : ""}
      <div style="white-space:pre-line;font-size:14px;color:var(--muted)">${esc(o.items)}</div>
      <div>${o.paid ? `<span class="tag" style="background:#e8f6ee;color:#1f8a4c">Déjà payé ✓ rien à encaisser</span>` : `À encaisser : <span class="cash">${fmt(o.total)}</span>`}</div>
      ${o.status==="Livrée" ? `<b style="color:var(--ok)">✓ Livrée</b>` : `<div class="row"><a class="call" href="tel:+${tel(ph)}">📞 Appeler</a><a class="map" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place + ", Abidjan")}" target="_blank" rel="noopener">🗺️ Itinéraire</a></div>
      <div class="row"><button type="button" class="live" data-done="${esc(o.id)}">✓ Livré${o.paid ? "" : " et encaissé"}</button></div>`}
    </article>`; }).join("") : `<p class="empty">Rien pour le moment 🌸</p>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-done]"); if (!b) return;
  const o = D.orders.find(x => x.id === b.dataset.done); if (!confirm(`Confirmer : ${o.id} livrée${o.paid ? "" : " et " + fmt(o.total) + " encaissés"} ?`)) return;
  b.disabled = true; b.textContent = "Enregistrement…";
  fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action:"courierDone", k:K, id:o.id, paid:true})})
    .then(r=>r.json()).then(d => { if (!d.ok) throw 0; o.status = "Livrée"; o.paid = true; render(); })
    .catch(() => { alert("Pas enregistré, réessayez."); b.disabled = false; b.textContent = "✓ Livré"; }); });
$("#re").onclick = load; load();
</script>
</body>
</html>
