<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fcecee">
<title>Gestion Timfa</title>
<link rel="icon" type="image/png" href="../images/logo-carre.png">
<link rel="apple-touch-icon" href="../images/logo-carre.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: application mobile d'abord — en-tête collant, chiffres clés, onglets Commandes / Stock, cartes. Couleurs du site Timfa. */
:root{
  --bg:#fffafa; --blush:#fcecee; --blush-2:#f7d9dd; --rose:#c4526e; --ink:#2a1c1e; --muted:#7e6a6e; --line:#f1dfe2; --card:#fff;
  --ok:#1f8a4c; --ok-bg:#dff3e6; --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#d6334a; --bad-bg:#fde3e6; --info-bg:#e8eefc; --info:#2f4fa8;
  --display:"Playfair Display", Georgia, serif; --body:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--blush)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.rose{color:var(--rose)}

/* Connexion */
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,var(--blush) 0%,var(--blush) 45%,var(--blush-2) 100%);position:relative;overflow:hidden}
#login .box{width:min(380px,92vw);background:#fff;border-radius:28px;padding:34px 28px;text-align:center;box-shadow:0 40px 70px -40px rgba(120,30,60,.45);animation:pop .7s cubic-bezier(.3,1.4,.5,1) both;position:relative;z-index:2}
#login img{width:200px;margin:0 auto 8px;display:block}
#login h1{font-family:var(--display);font-weight:500;font-size:30px;margin:4px 0 6px}
#login p{color:var(--muted);margin:0 0 20px}
.pin{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.pin input{width:46px;height:56px;border:1px solid var(--line);border-radius:14px;text-align:center;font-size:24px;font-weight:600;background:var(--bg);-webkit-text-security:disc}
.pin input:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 3px rgba(196,82,110,.15)}
.shake{animation:shake .45s}
#loginErr{color:var(--bad);font-size:14px;min-height:20px}
.spark{position:absolute;width:18px;height:18px;background:#d9a441;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:twinkle 3s ease-in-out infinite}

/* En-tête */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(252,236,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
header img{height:46px}
.hello{font-family:var(--display);font-size:18px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.icon-btn svg{width:19px;height:19px}
.icon-btn.spin svg{animation:spin 1s linear infinite}

/* Chiffres */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-block:18px 6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.kpi small{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:500;color:var(--rose);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi.dark{background:var(--ink);border-color:var(--ink)}.kpi.dark small{color:#d8c4c8}.kpi.dark b{color:#fff}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:26px}}
.alerts{display:flex;gap:8px;flex-wrap:wrap;padding-block:6px 4px}
.alert{font-size:13px;font-weight:500;border-radius:999px;padding:6px 12px;animation:rise .5s both}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.info{background:var(--info-bg);color:var(--info)}

/* Onglets */
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;margin-block:14px 12px;width:fit-content;position:relative}
.tabs button{border:0;background:none;border-radius:999px;padding:9px 18px;white-space:nowrap;font-weight:500;position:relative;z-index:1;transition:color .3s}
.tabs button[aria-selected="true"]{color:#fff}
@media (max-width:420px){.tabs button{padding:9px 12px;font-size:14px}.count{margin-left:4px}}
.tabs .pill{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--ink);transition:left .35s cubic-bezier(.3,1.2,.5,1),width .35s}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:#fff;font-size:11px;margin-left:6px;padding:0 5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--rose);color:#fff;border-color:var(--rose)}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px}

/* Commandes */
.orders{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:60px}
@media (max-width:820px){.orders{grid-template-columns:1fr}}
.order{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;gap:10px;position:relative;overflow:hidden;animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*45ms);transition:box-shadow .3s,transform .3s}
.order:hover{box-shadow:0 20px 34px -26px rgba(120,30,60,.5);transform:translateY(-2px)}
.order::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--st,var(--line))}
.o-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.o-id{font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.04em}
.o-name{font-family:var(--display);font-size:21px;line-height:1.2}
.o-when{font-size:12.5px;color:var(--muted)}
.o-total{font-family:var(--display);font-size:24px;color:var(--rose);white-space:nowrap;font-variant-numeric:tabular-nums}
.o-items{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px;white-space:pre-line}
.o-meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--blush);color:var(--rose)}
.tag.pre{background:var(--info-bg);color:var(--info)}.tag.paid{background:var(--ok-bg);color:var(--ok)}.tag.unpaid{background:var(--warn-bg);color:var(--warn)}
.o-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.o-ctrl label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.o-ctrl select,.o-ctrl input[type=date]{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;width:100%;min-width:0;font-size:14px;color:var(--ink)}
.o-ctrl input[type=date].empty{background:#fff7e0;border-color:#f0d9a0}
.o-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;text-decoration:none;transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px}
.btn.wa{background:#25d366;color:#fff}
.btn.soft{background:var(--blush);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.menu{position:relative}
.menu-list{position:absolute;bottom:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px -20px rgba(0,0,0,.25);padding:6px;display:grid;min-width:230px;z-index:5;animation:pop .25s both}
.menu-list a{padding:9px 12px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink)}
.menu-list a:hover{background:var(--blush)}
.empty-state{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px;background:#fff;border:1px dashed var(--line);border-radius:22px}
.empty-state b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:500;margin-bottom:4px}

/* Stock */
.stock-list{display:grid;gap:8px;padding-bottom:60px}
.s-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px;animation:rise .45s both;animation-delay:calc(var(--i)*18ms)}
.s-name{font-weight:500;line-height:1.3}
.s-name small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.s-badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.s-badge.ok{background:var(--ok-bg);color:var(--ok)}.s-badge.low{background:var(--warn-bg);color:var(--warn)}.s-badge.out{background:var(--bad-bg);color:var(--bad)}.s-badge.none{background:#f2eeee;color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:#fff;font-size:20px;line-height:1}
.stepper button:active{background:var(--blush)}
.stepper input{width:52px;height:38px;border:0;border-inline:1px solid var(--line);text-align:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.bump{animation:bumpy .35s}
@media (max-width:560px){.s-row{grid-template-columns:1fr auto}.s-badge{grid-column:1;justify-self:start}.stepper{grid-row:1/span 2;grid-column:2}}
.group-title{font-family:var(--display);font-size:20px;margin:16px 4px 4px}

/* Graphiques */
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;animation:rise .6s both}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.p-head h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
.p-sub{color:var(--muted);font-size:13px}
.chart-main{margin-top:12px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.bar{transform-origin:bottom;transform-box:fill-box;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms)}
.bar.today{fill:var(--rose)}
.ax{font:11px var(--body);fill:var(--muted)}
.val{font:600 11px var(--body);fill:var(--ink)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:60px}
@media (max-width:820px){.stats-grid{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:13.5px}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .v{font-weight:600;font-variant-numeric:tabular-nums;color:var(--rose)}
.hbar .track{grid-column:1/-1;height:10px;border-radius:999px;background:var(--blush);overflow:hidden}
.hbar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#e98aa2,var(--rose));transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*80ms)}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut-wrap svg{width:150px;height:150px}
.arc{animation:dash 1s ease both;animation-delay:calc(var(--i)*120ms)}
.legend{display:grid;gap:6px;font-size:13.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.brief{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brief div{background:var(--bg);border-radius:16px;padding:12px}
.brief small{display:block;color:var(--muted);font-size:12px}
.brief b{font-family:var(--display);font-size:22px;font-weight:500;color:var(--rose)}
.empty-chart{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
.s-row.missing{border-style:dashed}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes dash{from{stroke-dasharray:0 999}}

.profit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.profit-grid div{background:var(--bg);border-radius:16px;padding:12px 14px}
.profit-grid small{display:block;color:var(--muted);font-size:12.5px}
.profit-grid b{font-family:var(--display);font-size:24px;font-weight:500}
.profit-grid .win{background:linear-gradient(140deg,var(--ink),#4a3034);color:#fff}.profit-grid .win small{color:#e8cfd5}.profit-grid .win b{color:#fff}
@media (max-width:760px){.profit-grid{grid-template-columns:1fr 1fr}}
.exp-form{display:grid;grid-template-columns:1.4fr 1fr .8fr 1fr auto;gap:6px;margin-bottom:10px}
.exp-form input,.exp-form select{font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;background:#fff}
@media (max-width:760px){.exp-form{grid-template-columns:1fr 1fr}.exp-form input:first-child{grid-column:1/-1}}
.exp-list{display:grid;gap:6px;max-height:300px;overflow:auto}
.exp-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:13.5px}
.exp-row small{display:block;color:var(--muted);font-size:12px}
.exp-row b{color:var(--rose);font-variant-numeric:tabular-nums}
.exp-row button{border:0;background:none;color:var(--muted);font-size:18px}
.cost{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.cost input{width:70px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12.5px}
/* Toast + chargement */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skeleton{height:160px;border-radius:22px;background:linear-gradient(90deg,#fbeef0 25%,#fff 50%,#fbeef0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bumpy{40%{transform:scale(1.15)}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <i class="spark" style="top:14%;left:18%"></i><i class="spark" style="top:24%;right:16%;animation-delay:1s"></i><i class="spark" style="bottom:18%;left:28%;animation-delay:2s"></i>
  <div class="box">
    <img src="../images/logo-sombre.png" alt="Timfa online shop">
    <h1>Espace <span class="rose">gestion</span></h1>
    <p>Entrez votre code secret</p>
    <div class="pin" id="pin">
      <input inputmode="numeric" maxlength="1" aria-label="Chiffre 1"><input inputmode="numeric" maxlength="1" aria-label="Chiffre 2"><input inputmode="numeric" maxlength="1" aria-label="Chiffre 3"><input inputmode="numeric" maxlength="1" aria-label="Chiffre 4"><input inputmode="numeric" maxlength="1" aria-label="Chiffre 5"><input inputmode="numeric" maxlength="1" aria-label="Chiffre 6">
    </div>
    <div id="loginErr" role="alert"></div>
  </div>
</section>

<div id="app" hidden>
  <header><div class="wrap">
    <img src="../images/logo-sombre.png" alt="Timfa online shop">
    <span class="hello" id="hello">Bonjour ✨</span>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="refresh" type="button" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="icon-btn" id="logout" type="button" aria-label="Se déconnecter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
    </div>
  </div></header>

  <main class="wrap">
    <div class="kpis" id="kpis"></div>
    <div class="alerts" id="alerts"></div>
    <section class="panel chart-main"><div class="p-head"><h2>Ventes des 14 derniers jours</h2><span class="p-sub" id="salesSum"></span></div><div id="salesChart" class="chart"></div></section>

    <div class="tabs" role="tablist">
      <span class="pill" id="pill"></span>
      <button type="button" role="tab" id="tab-orders" aria-selected="true">Commandes<span class="count" id="newCount" hidden></span></button>
      <button type="button" role="tab" id="tab-stock" aria-selected="false">Stock</button>
      <button type="button" role="tab" id="tab-stats" aria-selected="false">Statistiques</button>
    </div>

    <section id="view-orders">
      <div class="toolbar">
        <input class="search" id="q" type="search" placeholder="Rechercher un nom, un numéro, un bijou…" aria-label="Rechercher">
        <button class="chip" type="button" data-f="todo" aria-pressed="true">À traiter</button>
        <button class="chip" type="button" data-f="new" aria-pressed="false">Nouvelles</button>
        <button class="chip" type="button" data-f="today" aria-pressed="false">À livrer aujourd’hui</button>
        <button class="chip" type="button" data-f="unpaid" aria-pressed="false">Non payées</button>
        <button class="chip" type="button" data-f="all" aria-pressed="false">Toutes</button>
      </div>
      <div class="orders" id="orders"><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section id="view-stats" hidden>
      <div class="stats-grid">
        <section class="panel profit" style="grid-column:1/-1"><div class="p-head"><h2>Bénéfice du mois</h2><span class="p-sub" id="profitSub"></span></div><div id="profit" class="profit-grid"></div></section>
        <section class="panel"><div class="p-head"><h2>Dépenses</h2><span class="p-sub" id="expSum"></span></div>
          <form id="expForm" class="exp-form"><input id="eLabel" placeholder="Libellé (ex. Pub Facebook)" required maxlength="80"><select id="eCat"><option>Publicité</option><option>Achat bijoux</option><option>Emballage</option><option>Livraison</option><option>Site / internet</option><option>Autre</option></select><input id="eAmount" type="number" inputmode="numeric" min="1" placeholder="Montant F" required><input id="eDate" type="date"><button class="btn dark" type="submit">Ajouter</button></form>
          <div id="expList" class="exp-list"></div></section>
        <section class="panel"><div class="p-head"><h2>Dates importantes à venir</h2></div><div id="datesList" class="exp-list"></div></section>
        <section class="panel"><div class="p-head"><h2>Bijoux les plus vendus</h2></div><div id="topChart"></div></section>
        <section class="panel"><div class="p-head"><h2>Commandes par statut</h2></div><div id="donut" class="donut-wrap"></div></section>
        <section class="panel"><div class="p-head"><h2>Votre stock</h2><span class="p-sub" id="stockVal"></span></div><div id="catChart"></div></section>
        <section class="panel"><div class="p-head"><h2>En bref</h2></div><div id="brief" class="brief"></div></section>
      </div>
    </section>

    <section id="view-stock" hidden>
      <div class="toolbar">
        <input class="search" id="qs" type="search" placeholder="Rechercher un bijou…" aria-label="Rechercher un bijou">
        <button class="chip" type="button" data-s="all" aria-pressed="true">Tous</button>
        <button class="chip" type="button" data-s="low" aria-pressed="false">Stock faible</button>
        <button class="chip" type="button" data-s="out" aria-pressed="false">Rupture</button>
        <button class="chip" type="button" data-s="none" aria-pressed="false">À remplir</button>
      </div>
      <div class="stock-list" id="stock"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../catalogue.js"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbyZiPC2weLVrD2r8GExmtv_6MxTw0TNZxvXRm4wRLXdy5qTdi2SPsDUQJVgV_s45h7N/exec";
const $ = s => document.querySelector(s);
const fmt = n => Number(n||0).toLocaleString("fr-FR").replace(/ | /g," ") + " F";
const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const STATUS = {"Nouvelle":"#c4526e","Confirmée":"#2f4fa8","En livraison":"#d9a441","Livrée":"#1f8a4c","Annulée":"#9b9496"};
let PIN = "", DATA = {orders:[], stock:[]}, oFilter = "todo", sFilter = "all", tab = "orders";
try { PIN = localStorage.getItem("timfa-pin") || ""; } catch(e) {}

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2000); }
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const addDays = (s,n) => { const d=new Date(s+"T12:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const frDate = s => s ? new Date(s.length>10?s:s+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}) : "";
const frTime = s => s ? new Date(s).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "";

/* ——— Connexion ——— */
const pins = [...document.querySelectorAll("#pin input")];
pins.forEach((inp,i) => {
  inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g,"").slice(-1); if (inp.value && pins[i+1]) pins[i+1].focus(); if (pins.every(p=>p.value)) tryLogin(pins.map(p=>p.value).join("")); });
  inp.addEventListener("keydown", e => { if (e.key==="Backspace" && !inp.value && pins[i-1]) pins[i-1].focus(); });
  inp.addEventListener("paste", e => { const t=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6); if(t.length===6){ e.preventDefault(); t.split("").forEach((c,j)=>pins[j].value=c); tryLogin(t);} });
});
function tryLogin(pin){
  $("#loginErr").textContent = "Vérification…";
  load(pin).then(ok => {
    if (ok) { PIN = pin; try{localStorage.setItem("timfa-pin",pin)}catch(e){} showApp(); }
    else { $("#loginErr").textContent = "Code incorrect"; $("#pin").classList.remove("shake"); void $("#pin").offsetWidth; $("#pin").classList.add("shake"); pins.forEach(p=>p.value=""); pins[0].focus(); }
  });
}
function showApp(){ $("#login").hidden = true; $("#app").hidden = false; render(); placePill(); }
$("#logout").onclick = () => { try{localStorage.removeItem("timfa-pin")}catch(e){} location.reload(); };

/* ——— Données ——— */
function load(pin = PIN){
  $("#refresh").classList.add("spin");
  return fetch(API + "?action=admin&pin=" + encodeURIComponent(pin)).then(r=>r.json()).then(d => {
    if (!d.ok) return false;
    DATA = d; if (!$("#app").hidden) render(); return true;
  }).catch(() => { toast("Connexion impossible, réessayez"); return false; }).finally(() => $("#refresh").classList.remove("spin"));
}
function post(body){
  return fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({pin:PIN}, body))}).then(r=>r.json());
}
$("#refresh").onclick = () => load().then(ok => ok && toast("À jour ✓"));
setInterval(() => { if (!$("#app").hidden && document.visibilityState==="visible") load(); }, 60000);

/* ——— Chiffres clés ——— */
function countUp(el, to, money){
  const start = performance.now(), dur = 700;
  (function step(t){ const k=Math.min(1,(t-start)/dur), v=Math.round(to*(1-Math.pow(1-k,3))); el.textContent = money ? fmt(v) : v; if(k<1) requestAnimationFrame(step); })(start);
}
function renderKpis(){
  const T = today(), O = DATA.orders.filter(o=>o.status!=="Annulée");
  const todayOrders = O.filter(o=>o.date.slice(0,10)===T);
  const weekStart = addDays(T,-6);
  const week = O.filter(o=>o.date.slice(0,10)>=weekStart).reduce((s,o)=>s+o.total,0);
  const month = O.filter(o=>o.date.slice(0,7)===T.slice(0,7)).reduce((s,o)=>s+o.total,0);
  const items = [["Commandes aujourd’hui", todayOrders.length, false, "dark"], ["Ventes aujourd’hui", todayOrders.reduce((s,o)=>s+o.total,0), true], ["7 derniers jours", week, true], ["Ce mois-ci", month, true]];
  $("#kpis").innerHTML = items.map((k,i)=>`<div class="kpi ${k[3]||""}" style="--i:${i}"><small>${k[0]}</small><b data-v="${k[1]}" data-m="${k[2]?1:""}">0</b></div>`).join("");
  document.querySelectorAll(".kpi b").forEach(b => countUp(b, +b.dataset.v, !!b.dataset.m));
  const nNew = DATA.orders.filter(o=>o.status==="Nouvelle").length;
  const noDate = DATA.orders.filter(o=>!o.delivery && !["Livrée","Annulée"].includes(o.status)).length;
  const toDay = DATA.orders.filter(o=>o.delivery===T && !["Livrée","Annulée"].includes(o.status)).length;
  const tomorrow = DATA.orders.filter(o=>o.delivery===addDays(T,1) && !["Livrée","Annulée"].includes(o.status)).length;
  const unpaid = DATA.orders.filter(o=>o.status==="Livrée" && !o.paid).reduce((s,o)=>s+o.total,0);
  const ST = mergedStock(), out = ST.filter(s=>s.qty===0).length, low = ST.filter(s=>s.qty>0 && s.qty<=2).length, todo = ST.filter(s=>s.qty===null).length;
  const a = [];
  if (nNew) a.push(`<span class="alert bad">${nNew} nouvelle${nNew>1?"s":""} commande${nNew>1?"s":""} à confirmer</span>`);
  if (noDate) a.push(`<span class="alert warn">${noDate} sans date de livraison</span>`);
  if (toDay) a.push(`<span class="alert info">${toDay} à livrer aujourd’hui</span>`);
  if (tomorrow) a.push(`<span class="alert info">${tomorrow} à livrer demain</span>`);
  if (unpaid) a.push(`<span class="alert warn">${fmt(unpaid)} livrés non payés</span>`);
  if (out) a.push(`<span class="alert bad">${out} bijou${out>1?"x":""} en rupture</span>`);
  if (low) a.push(`<span class="alert warn">${low} en stock faible</span>`);
  if (todo) a.push(`<span class="alert info">${todo} bijou${todo>1?"x":""} sans stock renseigné</span>`);
  $("#alerts").innerHTML = a.join("");
  $("#newCount").hidden = !nNew; $("#newCount").textContent = nNew;
  const h = new Date().getHours(); $("#hello").textContent = (h<18 ? "Bonjour" : "Bonsoir") + " ✨";
}

/* ——— Commandes ——— */
const WA_TPL = [
  ["Confirmer la commande", o => `Bonjour ${o.name} 😊 Merci pour votre commande ${o.id} chez Timfa online shop ✨\n${o.items}\nTotal : ${fmt(o.total)}\n${o.delivery ? "Livraison prévue " + frDate(o.delivery) + "." : "Je vous confirme la date de livraison très vite."}`],
  ["Livreur en route", o => `Bonjour ${o.name} 😊 Votre colis Timfa (${o.id}) est en route 🚚 Le livreur va vous appeler. Pensez à préparer ${fmt(o.total)} pour le paiement à la livraison. Merci !`],
  ["Merci + demander un avis", o => `Merci beaucoup ${o.name} pour votre confiance 💕 J’espère que votre bijou vous plaît ! Si vous avez une minute, envoyez-moi une petite photo ou un mot : ça aide énormément ma boutique 🙏 N’oubliez jamais : vous êtes une reine 👑`],
  ["Paiement expédition", o => `Bonjour ${o.name}, pour l’expédition merci d’envoyer ${fmt(o.total)} sur le 07 79 51 25 04, puis la capture du paiement avec votre nom ici. J’expédie dès réception 📦`]
];
function waUrl(o, text){ let d = String(o.phone).replace(/\D/g,""); if (d.length===10) d = "225"+d; return "https://wa.me/"+d+(text?"?text="+encodeURIComponent(text):""); }
function matchOrder(o){
  const T = today(), q = $("#q").value.trim().toLowerCase();
  if (q && !(o.id+" "+o.name+" "+o.phone+" "+o.items+" "+o.place).toLowerCase().includes(q)) return false;
  if (oFilter==="todo") return !["Livrée","Annulée"].includes(o.status) || (o.status==="Livrée" && !o.paid);
  if (oFilter==="new") return o.status==="Nouvelle";
  if (oFilter==="today") return o.delivery===T && !["Livrée","Annulée"].includes(o.status);
  if (oFilter==="unpaid") return !o.paid && o.status!=="Annulée";
  return true;
}
function orderCard(o, i){
  const st = Object.keys(STATUS).map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("");
  return `<article class="order" style="--i:${i};--st:${STATUS[o.status]||"#ddd"}" data-id="${esc(o.id)}">
    <div class="o-head"><div><div class="o-id">${esc(o.id)} · <span class="o-when">${frDate(o.date)} à ${frTime(o.date)}</span></div><div class="o-name">${esc(o.name)}</div><div class="o-when">${esc(o.place)}${o.place?" · ":""}${esc(o.phone)}</div></div><div class="o-total">${fmt(o.total)}</div></div>
    <div class="o-items">${esc(o.items)}</div>
    <div class="o-meta"><span class="tag">${esc(o.zone)} · livraison ${fmt(o.fee)}</span>${o.discount?`<span class="tag">−${fmt(o.discount)} site</span>`:""}${o.preorder?`<span class="tag pre">Précommande</span>`:""}<span class="tag ${o.paid?"paid":"unpaid"}">${o.paid?"Payée ✓":esc(o.payment||"Non payée")}</span></div>
    <div class="o-ctrl">
      <label>Statut<select data-act="status">${st}</select></label>
      <label>Date de livraison<input type="date" data-act="delivery" value="${o.delivery}" class="${o.delivery?"":"empty"}"></label>
    </div>
    <div class="o-actions">
      <a class="btn wa" href="${waUrl(o)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Z"/></svg>WhatsApp</a>
      <div class="menu"><button class="btn soft" type="button" data-act="tpl">Message prêt ▾</button></div>
      <button class="btn ${o.paid?"ok":"dark"}" type="button" data-act="paid">${o.paid?"Payée ✓":"Marquer payée"}</button>
    </div>
  </article>`;
}
function renderOrders(){
  const list = DATA.orders.filter(matchOrder);
  $("#orders").innerHTML = list.length ? list.map(orderCard).join("") :
    `<div class="empty-state"><b>${DATA.orders.length ? "Rien à traiter ici ✨" : "Pas encore de commande"}</b>${DATA.orders.length ? "Changez de filtre pour voir les autres commandes." : "Les commandes passées sur le site apparaîtront ici automatiquement."}</div>`;
}
function updateOrder(id, patch, msg){
  const o = DATA.orders.find(x=>x.id===id); Object.assign(o, patch); render();
  post(Object.assign({action:"updateOrder", id}, patch)).then(d => toast(d.ok ? msg : "Erreur : " + (d.error||"réessayez"))).catch(()=>toast("Connexion impossible"));
}
$("#orders").addEventListener("change", e => {
  const card = e.target.closest(".order"); if (!card) return; const id = card.dataset.id;
  if (e.target.dataset.act==="status") updateOrder(id, {status:e.target.value}, e.target.value==="Annulée" ? "Commande annulée · stock remis ✓" : "Statut : " + e.target.value + " ✓");
  if (e.target.dataset.act==="delivery") updateOrder(id, {delivery:e.target.value}, e.target.value ? "Livraison prévue " + frDate(e.target.value) + " ✓" : "Date retirée");
});
$("#orders").addEventListener("click", e => {
  const card = e.target.closest(".order"); if (!card) return; const id = card.dataset.id, o = DATA.orders.find(x=>x.id===id);
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act==="paid") updateOrder(id, {paid:!o.paid}, o.paid ? "Marquée non payée" : "Paiement enregistré 💰");
  if (b.dataset.act==="tpl") {
    document.querySelectorAll(".menu-list").forEach(m=>m.remove());
    const m = document.createElement("div"); m.className = "menu-list";
    m.innerHTML = WA_TPL.map(t=>`<a href="${waUrl(o, t[1](o))}" target="_blank" rel="noopener">${t[0]}</a>`).join("");
    b.parentElement.appendChild(m);
  }
});
document.addEventListener("click", e => { if (!e.target.closest(".menu")) document.querySelectorAll(".menu-list").forEach(m=>m.remove()); });

/* ——— Stock : tableau + catalogue du site ——— */
function catalogueRows(){
  const out = [];
  (window.TIMFA_CATALOGUE||[]).forEach(p => {
    const vs = p.variants ? p.variants.map((v,i)=>({code:p.id+"#"+i, variant:v.name})) : [{code:p.id, variant:""}];
    vs.forEach(v => (p.sizes ? p.sizes.map(z=>({code:v.code+"@"+z, variant:(v.variant?v.variant+" · ":"")+"taille "+z})) : [v]).forEach(x => out.push({code:x.code, name:p.name, variant:x.variant, cat:p.cat, price:p.price||0, isNew:!!p.isNew})));
  });
  return out;
}
function mergedStock(){
  const sheet = (DATA.stock||[]).filter(s => !/^ensemble/.test(s.code)), have = new Set(sheet.map(s=>s.code));
  const extra = catalogueRows().filter(c => !have.has(c.code)).map(c => Object.assign({qty:null, missing:true}, c));
  return sheet.concat(extra);
}
/* ——— Stock ——— */
function sBadge(q){ return q===null ? `<span class="s-badge none">À remplir</span>` : q<=0 ? `<span class="s-badge out">Rupture</span>` : q<=2 ? `<span class="s-badge low">Stock faible</span>` : `<span class="s-badge ok">Disponible</span>`; }
function renderStock(){
  const q = $("#qs").value.trim().toLowerCase();
  const list = mergedStock().filter(s => (!q || (s.name+" "+s.variant).toLowerCase().includes(q)) &&
    (sFilter==="all" || (sFilter==="low" && s.qty>0 && s.qty<=2) || (sFilter==="out" && s.qty===0) || (sFilter==="none" && s.qty===null)));
  let html = "", lastNew = null, i = 0;
  list.forEach(s => {
    if (lastNew !== s.isNew) { html += `<div class="group-title">${s.isNew ? "Nouvelle collection" : "Collection"}</div>`; lastNew = s.isNew; }
    html += `<div class="s-row${s.missing?" missing":""}" style="--i:${i++}" data-code="${esc(s.code)}"><div class="s-name">${esc(s.name)}<small>${[esc(s.variant||""), s.price?fmt(s.price):""].filter(Boolean).join(" · ")}</small>${s.missing ? "" : `<label class="cost">Prix d’achat <input type="number" inputmode="numeric" min="0" data-cost="${esc(s.code)}" value="${s.cost||""}" placeholder="–"> F</label>`}</div>${sBadge(s.qty)}
      <div class="stepper"><button type="button" data-d="-1" aria-label="Retirer une pièce">−</button><input type="number" inputmode="numeric" min="0" value="${s.qty===null?"":s.qty}" placeholder="–" aria-label="Pièces en stock"><button type="button" data-d="1" aria-label="Ajouter une pièce">+</button></div></div>`;
  });
  $("#stock").innerHTML = html || `<div class="empty-state"><b>Aucun bijou</b>Changez de filtre.</div>`;
}
const pending = {};
function setStock(code, qty){
  let s = DATA.stock.find(x=>x.code===code);
  if (!s) { const c = mergedStock().find(x=>x.code===code); s = Object.assign({}, c, {missing:false}); DATA.stock.push(s); }
  s.qty = qty;
  const row = document.querySelector(`.s-row[data-code="${CSS.escape(code)}"]`);
  if (row) { row.querySelector(".s-badge").outerHTML = sBadge(qty); row.querySelector("input").value = qty===null?"":qty; const inp=row.querySelector("input"); inp.classList.remove("bump"); void inp.offsetWidth; inp.classList.add("bump"); }
  clearTimeout(pending[code]);
  pending[code] = setTimeout(() => post({action:"setStock", code, qty: qty===null?"":qty, name:s.name, variant:s.variant, cat:s.cat, price:s.price, isNew:s.isNew}).then(d => toast(d.ok ? `${s.name}${s.variant?" · "+s.variant:""} : ${qty===null?"vide":qty+" pièce"+(qty>1?"s":"")} ✓` : "Erreur, réessayez")).catch(()=>toast("Connexion impossible")), 600);
  renderKpis();
}
$("#stock").addEventListener("click", e => {
  const b = e.target.closest("[data-d]"); if (!b) return; const code = b.closest(".s-row").dataset.code, s = mergedStock().find(x=>x.code===code);
  setStock(code, Math.max(0, (s.qty||0) + Number(b.dataset.d)));
});
$("#stock").addEventListener("change", e => {
  if (e.target.dataset.cost !== undefined) { const code = e.target.dataset.cost, v = parseInt(e.target.value,10)||0, s = DATA.stock.find(x=>x.code===code); if (s) s.cost = v; post({action:"setCost", code, cost:v}).then(d=>toast(d.ok?"Prix d’achat enregistré ✓":"Erreur")); return; }
  if (e.target.tagName!=="INPUT") return; const code = e.target.closest(".s-row").dataset.code;
  setStock(code, e.target.value==="" ? null : Math.max(0, parseInt(e.target.value,10)||0));
});

/* ——— Graphiques ——— */
const dayKey = d => d.toISOString().slice(0,10);
function renderSales(){
  const T = today(), days = [...Array(14)].map((_,k) => addDays(T, k-13));
  const O = DATA.orders.filter(o=>o.status!=="Annulée");
  const vals = days.map(d => O.filter(o=>o.date.slice(0,10)===d).reduce((s,o)=>s+o.total,0));
  const max = Math.max(...vals, 10000), W = Math.max(320, $("#salesChart").clientWidth || 700), H = W < 500 ? 170 : 200, P = 26, bw = (W-2*P)/14;
  const total = vals.reduce((a,b)=>a+b,0);
  $("#salesSum").textContent = fmt(total) + " · " + O.filter(o=>o.date.slice(0,10)>=days[0]).length + " commande(s)";
  let g = `<svg viewBox="0 0 ${W} ${H+34}" role="img" aria-label="Ventes par jour">`;
  [0,.5,1].forEach(f => { const y = P + (H-P)*(1-f); g += `<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="#f1dfe2" stroke-dasharray="${f?"3 4":""}"/><text class="ax" x="0" y="${y+4}">${f? Math.round(max*f/1000)+"k":"0"}</text>`; });
  vals.forEach((v,k) => {
    const h = Math.max(v? 4:2, (H-P)*v/max), x = P + k*bw + bw*.18, y = H - h, isT = days[k]===T;
    g += `<rect class="bar${isT?" today":""}" style="--i:${k}" x="${x}" y="${y}" width="${bw*.64}" height="${h}" rx="6" fill="${v? "#e9a3b4":"#f4e3e6"}"><title>${frDate(days[k])} : ${fmt(v)}</title></rect>`;
    if (v) g += `<text class="val" x="${x+bw*.32}" y="${y-6}" text-anchor="middle">${Math.round(v/1000)}k</text>`;
    if (k%2===1 || isT) g += `<text class="ax" x="${x+bw*.32}" y="${H+18}" text-anchor="middle">${isT?"Auj.":new Date(days[k]+"T12:00").getDate()}</text>`;
  });
  $("#salesChart").innerHTML = g + "</svg>";
}
function costOf(code){ const s = (DATA.stock||[]).find(x=>x.code===code); return s ? (s.cost||0) : 0; }
function renderMoney(){
  const T = today(), M = T.slice(0,7), O = DATA.orders.filter(o=>o.status!=="Annulée" && o.date.slice(0,7)===M);
  const ca = O.reduce((a,o)=>a+o.total-o.fee,0);
  let cogs = 0, missing = 0; O.forEach(o => String(o.codes||"").split(",").forEach(c => { const m = c.trim().match(/^(.+) x(\d+)$/); if (!m) return; const k = costOf(m[1]); if (!k) missing++; cogs += k*(+m[2]); }));
  const EX = (DATA.expenses||[]).filter(x=>x.date.slice(0,7)===M), dep = EX.reduce((a,x)=>a+x.amount,0), ben = ca - cogs - dep;
  $("#profitSub").textContent = new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"}) + (missing ? ` · ${missing} bijou(x) vendu(s) sans prix d’achat` : "");
  $("#profit").innerHTML = `<div><small>Ventes (hors livraison)</small><b>${fmt(ca)}</b></div><div><small>Coût des bijoux vendus</small><b>${fmt(cogs)}</b></div><div><small>Dépenses</small><b>${fmt(dep)}</b></div><div class="win"><small>Bénéfice</small><b>${fmt(ben)}</b></div>`;
  const all = (DATA.expenses||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  $("#expSum").textContent = "Ce mois : " + fmt(dep);
  $("#expList").innerHTML = all.length ? all.map(x=>`<div class="exp-row"><span>${esc(x.label||x.cat)}<small>${esc(x.cat)} · ${frDate(x.date)}</small></span><b>${fmt(x.amount)}</b><button type="button" data-delexp="${x.row}" aria-label="Supprimer">×</button></div>`).join("") : `<div class="empty-chart">Ajoutez vos dépenses (pub, achats, emballages…) pour voir votre vrai bénéfice.</div>`;
  const now = new Date(), up = [];
  for (let k=0;k<45;k++){ const d = new Date(now); d.setDate(d.getDate()+k); const key = String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
    (DATA.dates||[]).forEach(x => { if (String(x.day).replace(/^'/,"")===key) up.push(Object.assign({k}, x)); }); }
  $("#datesList").innerHTML = up.length ? up.map(x=>`<div class="exp-row"><span>${esc(x.occasion)} de ${esc(x.forWho||"?")}<small>${x.k ? "Dans "+x.k+" jour"+(x.k>1?"s":"") : "Aujourd’hui !"} · cliente ${esc(x.client)}</small></span><b>${esc(String(x.day).replace(/^'/,""))}</b><a class="btn wa" style="padding:6px 10px" target="_blank" rel="noopener" href="${waUrl({phone:x.phone}, `Bonjour ${x.client} 😊 Le ${String(x.day).replace(/^'/,"")} approche : ${x.occasion.toLowerCase()} de ${x.forWho} ✨ On vous prépare un joli bijou cette année aussi ? Voici nos nouveautés : https://fatimsidiba-hue.github.io`)}">Écrire</a></div>`).join("") : `<div class="empty-chart">Les anniversaires notés par vos clientes apparaîtront ici, avec un bouton pour leur écrire.</div>`;
}
$("#expForm") && $("#expForm").addEventListener("submit", e => { e.preventDefault();
  const x = {label:$("#eLabel").value.trim(), cat:$("#eCat").value, amount:parseInt($("#eAmount").value,10)||0, date:$("#eDate").value || today()};
  DATA.expenses = (DATA.expenses||[]).concat([Object.assign({row:0}, x)]); renderMoney();
  post(Object.assign({action:"addExpense"}, x)).then(d => { toast(d.ok ? "Dépense ajoutée ✓" : "Erreur"); load(); }); e.target.reset(); });
document.addEventListener("click", e => { const b = e.target.closest("[data-delexp]"); if (!b) return; post({action:"delExpense", row:+b.dataset.delexp}).then(()=>{ toast("Dépense supprimée"); load(); }); });
function renderStats(){
  renderMoney();
  const O = DATA.orders.filter(o=>o.status!=="Annulée"), count = {};
  O.forEach(o => String(o.items).split("\n").forEach(line => { const m = line.match(/^(\d+) × (.+) : [\d\s]+F$/); if (!m) return;
    m[2] = m[2].replace(/ \(précommande\)$/,"");
    const q = +m[1], name = m[2].replace(/^Ensemble : /,"");
    if (/^Ensemble : /.test(m[2])) name.split(" + ").forEach(n => count[n] = (count[n]||0) + q); else count[name] = (count[name]||0) + q; }));
  const top = Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,6), tmax = top.length ? top[0][1] : 1;
  $("#topChart").innerHTML = top.length ? top.map(([n,v],i)=>`<div class="hbar" style="--i:${i}"><span class="n">${esc(n)}</span><span class="v">${v}</span><div class="track"><div class="fill" style="width:${v/tmax*100}%;--i:${i}"></div></div></div>`).join("") : `<div class="empty-chart">Vos meilleures ventes apparaîtront ici dès les premières commandes ✨</div>`;
  const st = Object.keys(STATUS).map(k => [k, DATA.orders.filter(o=>o.status===k).length]).filter(x=>x[1]), tot = st.reduce((a,b)=>a+b[1],0);
  let off = 0, arcs = "";
  st.forEach(([k,v],i) => { const len = v/tot*289; arcs += `<circle class="arc" style="--i:${i}" cx="60" cy="60" r="46" fill="none" stroke="${STATUS[k]}" stroke-width="16" stroke-dasharray="${len} ${289-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += len; });
  $("#donut").innerHTML = tot ? `<svg viewBox="0 0 120 120">${arcs}<text x="60" y="58" text-anchor="middle" style="font:500 26px var(--display);fill:var(--ink)">${tot}</text><text x="60" y="76" text-anchor="middle" class="ax">commandes</text></svg><div class="legend">${st.map(([k,v])=>`<div><i style="background:${STATUS[k]}"></i>${k} · <b>${v}</b></div>`).join("")}</div>` : `<div class="empty-chart" style="grid-column:1/-1">Pas encore de commande</div>`;
  const ST = mergedStock().filter(s=>s.qty), cats = {};
  ST.forEach(s => { const c = s.cat || (s.code.startsWith("collier")?"Colliers":s.code.startsWith("bracelet")?"Bracelets & parures":"Bagues"); cats[c] = (cats[c]||0) + s.qty; });
  const value = ST.reduce((a,s)=>a+s.qty*(s.price||0),0), pieces = ST.reduce((a,s)=>a+s.qty,0);
  $("#stockVal").textContent = pieces + " pièces · " + fmt(value);
  const ce = Object.entries(cats).sort((a,b)=>b[1]-a[1]), cmax = ce.length ? ce[0][1] : 1;
  $("#catChart").innerHTML = ce.length ? ce.map(([n,v],i)=>`<div class="hbar" style="--i:${i}"><span class="n">${esc(n)}</span><span class="v">${v} pièces</span><div class="track"><div class="fill" style="width:${v/cmax*100}%;--i:${i}"></div></div></div>`).join("") : `<div class="empty-chart">Renseignez votre stock dans l’onglet Stock</div>`;
  const paid = O.filter(o=>o.paid), avg = O.length ? Math.round(O.reduce((a,o)=>a+o.total,0)/O.length) : 0;
  const clients = new Set(O.map(o=>String(o.phone).replace(/\D/g,"").slice(-8))).size;
  $("#brief").innerHTML = `<div><small>Panier moyen</small><b>${fmt(avg)}</b></div><div><small>Clientes</small><b>${clients}</b></div><div><small>Encaissé</small><b>${fmt(paid.reduce((a,o)=>a+o.total,0))}</b></div><div><small>Ensembles vendus</small><b>${O.reduce((a,o)=>a+(String(o.items).match(/Ensemble/g)||[]).length,0)}</b></div>`;
}

/* ——— Onglets et filtres ——— */
function placePill(){ const b = $("#tab-"+tab), p = $("#pill"); p.style.left = b.offsetLeft+"px"; p.style.width = b.offsetWidth+"px"; }
["orders","stock","stats"].forEach(t => $("#tab-"+t).onclick = () => { tab=t; ["orders","stock","stats"].forEach(x => { $("#tab-"+x).setAttribute("aria-selected", x===t); $("#view-"+x).hidden = x!==t; }); placePill(); renderTab(); });
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { oFilter=b.dataset.f; document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderOrders(); });
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sFilter=b.dataset.s; document.querySelectorAll("[data-s]").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderStock(); });
$("#q").addEventListener("input", renderOrders); $("#qs").addEventListener("input", renderStock);
addEventListener("resize", placePill);
function renderTab(){ tab==="stock" ? renderStock() : tab==="stats" ? renderStats() : renderOrders(); }
function render(){ renderKpis(); renderSales(); renderTab(); }

/* ——— Démarrage ——— */
if (PIN) { load(PIN).then(ok => ok ? showApp() : (PIN="", pins[0].focus())); } else pins[0].focus();
</script>
</body>
